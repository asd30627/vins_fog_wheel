%YAML:1.0
---
# explicit fixed extrinsic for urban39-pankyo
# source_csv: /mnt/sata4t/ivlab3_data/vins_project/results/fixed_extrinsic_best_available_fog/urban39-pankyo/extrinsic_parameter.csv
extrinsic_source: "explicit_fixedext_config"
imu: 1
num_of_cam: 2

imu_topic: "/imu/data_raw"
image0_topic: "/stereo/left/image_raw"
image1_topic: "/stereo/right/image_raw"
output_path: "/mnt/sata4t/ivlab3_data/vins_project/results/vins_eval_results/KAIST_urban39_pankyo"
pose_graph_save_path: "/mnt/sata4t/ivlab3_data/vins_project/results/vins_eval_results/KAIST_urban39_pankyo/pose_graph/"

cam0_calib: "cam0_kaist.yaml"
cam1_calib: "cam1_kaist.yaml"

image_width: 1280
image_height: 560

use_gpu         : 0
use_gpu_acc_flow: 0
use_gpu_ceres   : 0

# 先讓 VINS 以初值為中心去微調，不要先固定死
estimate_extrinsic: 0

# cam0：由 Vehicle2Stereo(以 left cam 為基準) 與 Vehicle2IMU 組出的初值
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -1.7750718089677209e-02, -1.9471857015609995e-02, 9.9965281912855342e-01, 1.3242322893518532e+00,
       -9.9984199800192552e-01, -5.9822446484614211e-04, -1.7765729903584215e-02, 2.1421397510974334e-02,
       9.4394852521567651e-04, -9.9981022644892614e-01, -1.9458161509465555e-02, -2.6208465777034430e-02,
       0.0000000000000000e+00, 0.0000000000000000e+00, 0.0000000000000000e+00, 1.0000000000000000e+00 ]

# cam1：先用 cam0 + stereo baseline 做近似初值
# 這只是初始化，不是最終真值
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -2.6278548503738897e-02, -9.3414669215842183e-03, 9.9961101178622980e-01, 1.3463655525052987e+00,
       -9.9965193919225681e-01, -2.0871681036616074e-03, -2.6299129234024665e-02, -4.4359964260397611e-01,
       2.3320286656749456e-03, -9.9995418931322066e-01, -9.2833677748147547e-03, -2.6555862303144273e-02,
       0.0000000000000000e+00, 0.0000000000000000e+00, 0.0000000000000000e+00, 1.0000000000000000e+00 ]

multiple_thread: 0

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1

max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

acc_n: 0.1
acc_w: 0.001
gyr_n: 0.001
gyr_w: 0.00001
g_norm: 9.81007
imu_noise_mode: "fog_xsens"

estimate_td: 0
td: 0.0

load_previous_pose_graph: 0
save_image: 1