%YAML:1.0
---
# explicit fixed extrinsic for urban26-dongtan
# source_csv: /mnt/sata4t/ivlab3_data/vins_project/results/fixed_extrinsic_best_available_fog/urban26-dongtan/extrinsic_parameter.csv
extrinsic_source: "explicit_fixedext_config"
imu: 1
num_of_cam: 2

imu_topic: "/imu/data_raw"
image0_topic: "/stereo/left/image_raw"
image1_topic: "/stereo/right/image_raw"
output_path: "/mnt/sata4t/ivlab3_data/vins_project/results/vins_eval_results/KAIST_urban39_pankyo"
pose_graph_save_path: "/mnt/sata4t/ivlab3_data/vins_project/results/vins_eval_results/KAIST_urban39_pankyo/pose_graph/"

cam0_calib: "cam0_kaist.yaml"
cam1_calib: "cam1_kaist.yaml"

image_width: 1280
image_height: 560

use_gpu         : 0
use_gpu_acc_flow: 0
use_gpu_ceres   : 0

# 先讓 VINS 以初值為中心去微調，不要先固定死
estimate_extrinsic: 0

# cam0：由 Vehicle2Stereo(以 left cam 為基準) 與 Vehicle2IMU 組出的初值
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -1.1647661020552924e-02, -2.2278954053608579e-02, 9.9968394015260031e-01, 1.4516611291574344e+00,
       -9.9993206033329396e-01, 7.1408737075429052e-04, -1.1634637804470715e-02, 6.3532637229620451e-02,
       -4.5465411533290867e-04, -9.9975153827613816e-01, -2.2285757876529422e-02, -5.2652630488182722e-02,
       0.0000000000000000e+00, 0.0000000000000000e+00, 0.0000000000000000e+00, 1.0000000000000000e+00 ]

# cam1：先用 cam0 + stereo baseline 做近似初值
# 這只是初始化，不是最終真值
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -1.4171901107182805e-02, -1.7496510786666752e-02, 9.9974648252909626e-01, 1.4518342085296936e+00,
       -9.9989857032296015e-01, -1.1683758398617350e-03, -1.4194504711250500e-02, -4.0778424738686608e-01,
       1.4164339409654114e-03, -9.9984624168328462e-01, -1.7478178014370016e-02, -5.4809721501114482e-02,
       0.0000000000000000e+00, 0.0000000000000000e+00, 0.0000000000000000e+00, 1.0000000000000000e+00 ]

multiple_thread: 0

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1

max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

acc_n: 0.1
acc_w: 0.001
gyr_n: 0.001
gyr_w: 0.00001
g_norm: 9.81007
imu_noise_mode: "fog_xsens"

estimate_td: 0
td: 0.0

load_previous_pose_graph: 0
save_image: 1