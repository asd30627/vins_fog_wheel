%YAML:1.0
---
# explicit fixed extrinsic for urban38-pankyo
# source_csv: /mnt/sata4t/ivlab3_data/vins_project/results/fixed_extrinsic_best_available_fog/urban38-pankyo/extrinsic_parameter.csv
extrinsic_source: "explicit_fixedext_config"
imu: 1
num_of_cam: 2

imu_topic: "/imu/data_raw"
image0_topic: "/stereo/left/image_raw"
image1_topic: "/stereo/right/image_raw"
output_path: "/mnt/sata4t/ivlab3_data/vins_project/results/vins_eval_results/KAIST_urban39_pankyo"
pose_graph_save_path: "/mnt/sata4t/ivlab3_data/vins_project/results/vins_eval_results/KAIST_urban39_pankyo/pose_graph/"

cam0_calib: "cam0_kaist.yaml"
cam1_calib: "cam1_kaist.yaml"

image_width: 1280
image_height: 560

use_gpu         : 0
use_gpu_acc_flow: 0
use_gpu_ceres   : 0

# 先讓 VINS 以初值為中心去微調，不要先固定死
estimate_extrinsic: 0

# cam0：由 Vehicle2Stereo(以 left cam 為基準) 與 Vehicle2IMU 組出的初值
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -1.1815555346520901e-02, -1.8104811751631256e-02, 9.9976627690840392e-01, 1.3010081937949927e+00,
       -9.9992971759835603e-01, -7.6194391448747290e-04, -1.1831285016563109e-02, -1.0667601470956210e-01,
       9.7596901860491636e-04, -9.9983580413631379e-01, -1.8094536511487513e-02, -1.7150693068057621e-01,
       0.0000000000000000e+00, 0.0000000000000000e+00, 0.0000000000000000e+00, 1.0000000000000000e+00 ]

# cam1：先用 cam0 + stereo baseline 做近似初值
# 這只是初始化，不是最終真值
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -2.0380929212978405e-02, -7.9683500912826610e-03, 9.9976053288837063e-01, 1.3249648457015559e+00,
       -9.9978956692071863e-01, -2.1702699789636348e-03, -2.0398818708466993e-02, -5.6268130338643441e-01,
       2.3322951995977670e-03, -9.9996589708101635e-01, -7.9224411680218765e-03, -1.7168888926619977e-01,
       0.0000000000000000e+00, 0.0000000000000000e+00, 0.0000000000000000e+00, 1.0000000000000000e+00 ]

multiple_thread: 0

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1

max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

acc_n: 0.1
acc_w: 0.001
gyr_n: 0.001
gyr_w: 0.00001
g_norm: 9.81007
imu_noise_mode: "fog_xsens"

estimate_td: 0
td: 0.0

load_previous_pose_graph: 0
save_image: 1